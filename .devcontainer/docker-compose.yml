version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: admin
      PGPASSWORD: LeaguePassword2026
      PGDATABASE: sports_db

  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: LeaguePassword2026
      POSTGRES_DB: sports_db
    extra_hosts:
      - "api.githubcopilot.com:127.0.0.1"
      - "copilot-proxy.githubusercontent.com:127.0.0.1"
